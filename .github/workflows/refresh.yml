name: Refresh articles & deploy

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [claude/japanese-news-aggregator-fb4npb, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch feeds
        run: node scripts/fetch.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh articles ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    # Pages deploy is best-effort: if GitHub Pages isn't enabled for the repo
    # yet, this job may fail without affecting the data refresh above.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pull latest (includes the refresh commit)
        run: git pull origin "${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
